services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - sentinel-postgres:/var/lib/postgresql/data

volumes:
  sentinel-postgres:
